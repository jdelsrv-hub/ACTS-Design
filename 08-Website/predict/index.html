<!doctype html>
<html lang="en" data-size="large" data-contrast="normal" data-font="system">
<head>
<meta charset="utf-8">
<!-- resizes-content keeps the suggestions above the phone's keyboard -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Predict</title>
<meta name="theme-color" content="#fafafa">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
<script>
// The cache-first worker would serve stale files while developing, so it stays off on 127.0.0.1 unless ?sw=1.
if ('serviceWorker' in navigator && (location.hostname !== '127.0.0.1' || location.search.includes('sw=1'))) navigator.serviceWorker.register('sw.js');
</script>
</head>
<body>
<header>
  <label for="text">Your message</label>
  <button type="button" id="more">More</button>
  <!-- U+FE0E keeps the cog as text, so it takes the theme's colour. -->
  <button type="button" id="open-settings" aria-label="Settings">⚙︎</button>
</header>
<div id="editor">
  <div id="mirror" aria-hidden="true"></div>
  <textarea id="text" spellcheck="false" autocapitalize="sentences" autofocus></textarea>
</div>
<div id="actions" role="group" aria-label="Actions">
  <button type="button" id="speak"><span aria-hidden="true">🔊</span><span>Speak</span></button>
  <button type="button" id="undo"><span aria-hidden="true">↩</span>Undo</button>
  <button type="button" id="clear"><span aria-hidden="true">✕</span>Clear</button>
</div>
<div id="tabs" role="tablist" aria-label="Input">
  <button type="button" role="tab" id="tab-keyboard" aria-controls="panel-keyboard" aria-selected="true">Keyboard</button>
  <button type="button" role="tab" id="tab-suggested" aria-controls="panel-suggested" aria-selected="false" tabindex="-1">Suggested words</button>
  <button type="button" role="tab" id="tab-favourites" aria-controls="panel-favourites" aria-selected="false" tabindex="-1">Favourite words</button>
  <button type="button" role="tab" id="tab-phrases" aria-controls="panel-phrases" aria-selected="false" tabindex="-1">Quick phrases</button>
</div>
<div id="panels">
  <div role="tabpanel" id="panel-keyboard" aria-labelledby="tab-keyboard">
    <div id="suggestions" role="group" aria-label="Suggestions"></div>
  </div>
  <div role="tabpanel" id="panel-suggested" aria-labelledby="tab-suggested" hidden>
    <p id="predictions-off" class="status" hidden>Word predictions are off <button type="button" id="predictions-on">Turn on</button></p>
    <p id="no-suggestions" class="status" hidden>No suggestions yet</p>
    <div id="suggested" tabindex="-1"></div>
  </div>
  <div role="tabpanel" id="panel-favourites" aria-labelledby="tab-favourites" hidden></div>
  <div role="tabpanel" id="panel-phrases" aria-labelledby="tab-phrases" hidden></div>
</div>
<p id="pager-live" class="visually-hidden" aria-live="polite"></p>
<dialog id="menu" aria-labelledby="menu-word">
  <form method="dialog">
    <p id="menu-word"></p>
    <button type="button" id="hear">Hear it</button>
    <button value="block">Don't suggest this</button>
    <button value="">Close</button>
  </form>
</dialog>
<dialog id="more-menu" aria-labelledby="more-title">
  <form method="dialog">
    <p id="more-title" class="title">More</p>
    <button type="button" id="copy">Copy</button>
    <button type="button" id="open-recent">Recent</button>
    <button type="button" id="open-learned">What it has learned</button>
    <button value="">Close</button>
  </form>
</dialog>
<dialog id="recent" aria-labelledby="recent-title">
  <form method="dialog">
    <p id="recent-title">Recent</p>
    <div id="recent-list"></div>
    <button value="">Close</button>
  </form>
</dialog>
<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog">
    <p id="settings-title" class="title">Settings</p>
    <fieldset data-key="textSize"><legend>Text size</legend><div class="seg"><button type="button" data-value="large">Large</button><button type="button" data-value="extra-large">Extra large</button><button type="button" data-value="huge">Huge</button></div></fieldset>
    <fieldset data-key="contrast"><legend>Colours</legend><div class="seg"><button type="button" data-value="normal">Normal</button><button type="button" data-value="high">High contrast</button><button type="button" data-value="dark">Dark</button></div></fieldset>
    <fieldset data-key="font"><legend>Font</legend><div class="seg"><button type="button" data-value="system">System</button><button type="button" data-value="hyperlegible">Hyperlegible</button></div></fieldset>
    <fieldset data-key="suggestionCount"><legend>Suggestions shown</legend><div class="seg"><button type="button" data-value="3">3</button><button type="button" data-value="4">4</button><button type="button" data-value="5">5</button></div></fieldset>
    <label class="switch"><input type="checkbox" role="switch" data-key="tapSafety"><span>Hold a suggestion a moment to pick it</span></label>
    <label class="switch"><input type="checkbox" role="switch" data-key="speakEachWord"><span>Say each word when I pick it</span></label>
    <label class="switch"><input type="checkbox" role="switch" data-key="clearAfterSpeak"><span>Clear the text after Speak</span></label>
    <label class="switch"><input type="checkbox" role="switch" data-key="phraseSpeaks"><span>Quick phrases speak when tapped</span></label>
    <label class="switch"><input type="checkbox" role="switch" data-key="paused"><span>Pause learning</span></label>
    <label class="field">Voice<select data-key="voiceURI"></select></label>
    <label class="field">Speaking speed<input type="range" min="0.5" max="2" step="0.1" data-key="rate"></label>
    <button type="button" id="test-voice">Test voice</button>
    <label class="field">Starter words<span class="hint">Names, places, pets and other words you use</span><textarea id="starters" rows="3"></textarea></label>
    <button type="button" id="add-starters" aria-label="Add starter words">Add</button>
    <button value="" class="close">Close</button>
  </form>
</dialog>
<dialog id="learned" aria-labelledby="learned-title">
  <form method="dialog">
    <p id="learned-title" class="title">What it has learned</p>
    <div class="trio">
      <button type="button" id="backup">Backup</button>
      <button type="button" id="restore">Restore</button>
      <button type="button" id="start-fresh">Start fresh</button>
    </div>
    <input type="file" id="restore-file" accept=".json,application/json" hidden>
    <h2>Words</h2>
    <ul id="word-list" class="list"></ul>
    <h2>Phrases</h2>
    <ul id="phrase-list" class="list"></ul>
    <h2>Words it won't suggest</h2>
    <ul id="blocked-list" class="list"></ul>
    <button value="" class="close">Close</button>
  </form>
</dialog>
<dialog id="confirm" aria-labelledby="confirm-text">
  <form method="dialog">
    <p id="confirm-text" class="title"></p>
    <button value="">Cancel</button>
    <button value="yes" id="confirm-yes"></button>
  </form>
</dialog>
<div id="toast" role="status" popover="manual"></div>
<p id="banner" role="alert" hidden></p>
</body>
</html>
